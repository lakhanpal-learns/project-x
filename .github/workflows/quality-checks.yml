name: Quality Checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mrshine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mrshine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mrshine_test?sslmode=disable
      SECRET_KEY: ci-only-secret-key-change-me-before-production
      CSRF_SECRET_KEY: ci-only-csrf-secret-change-me-before-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies and test runner
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Compile Python source
        run: python -m compileall -q backend/app backend/tests
      - name: Run backend tests
        run: python -m pytest -q backend/tests

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find frontend/js -type f -name '*.js' -print0)
