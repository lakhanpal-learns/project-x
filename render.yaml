services:
  - type: web
    name: mrshine-carwash
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mrshine-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: EMAILS_FROM_EMAIL
        value: "notifications@mrshine.com"
      - key: ADMIN_EMAIL
        value: "admin@mrshine.com"

databases:
  - name: mrshine-postgres
    region: oregon
    plan: free
    databaseName: mrshine_db
    user: mrshine_db_user
